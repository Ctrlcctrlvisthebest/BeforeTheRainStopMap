    <script type="module">
      try {
        const bytes = Uint8Array.from(atob(document.getElementById("studio-bundle").textContent), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const code = await new Response(stream).text();
        const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
        try { await import(url); } finally { URL.revokeObjectURL(url); }
      } catch (error) {
        console.error("Map studio could not start", error);
        const message = document.createElement("p");
        message.setAttribute("role", "alert");
        message.style.cssText = "padding:3rem;line-height:2";
        message.textContent = "地图工坊加载失败，请刷新重试，或使用较新版 Chrome、Edge、Firefox、Safari 打开。";
        document.getElementById("root").append(message);
      }
    </script>
